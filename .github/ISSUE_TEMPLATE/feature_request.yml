name: Feature request / Özellik önerisi
description: Suggest an idea for FCleaner.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve? / Hangi sorunu çözer?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution / Önerilen çözüm
  - type: textarea
    id: safety
    attributes:
      label: Could this delete user data? How should it be protected? / Kullanıcı verisini silebilir mi? Nasıl korunmalı?
